databaseChangeLog:
  - changeSet:
      id: 013_vacancy_integrity
      author: codex
      changes:
        - dropForeignKeyConstraint:
            baseTableName: respondent_applicant
            constraintName: fk_respondent_vacancy
        - addForeignKeyConstraint:
            baseTableName: respondent_applicant
            baseColumnNames: vacancy_id
            referencedTableName: vacancy
            referencedColumnNames: id
            constraintName: fk_respondent_vacancy
            onDelete: RESTRICT
        - dropForeignKeyConstraint:
            baseTableName: vacancy
            constraintName: fk_vacancy_employer
        - addForeignKeyConstraint:
            baseTableName: vacancy
            baseColumnNames: employer_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_vacancy_employer
            onDelete: RESTRICT
