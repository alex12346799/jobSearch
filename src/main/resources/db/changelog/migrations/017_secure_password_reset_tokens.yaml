databaseChangeLog:
  - changeSet:
      id: 017_create_secure_password_reset_tokens
      author: codex
      comment: Invalidate legacy plaintext reset tokens and replace them with hash-only one-time tokens
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints: {primaryKey: true, nullable: false}
              - column:
                  name: user_id
                  type: bigint
                  constraints: {nullable: false}
              - column:
                  name: token_hash
                  type: varchar(64)
                  constraints: {nullable: false}
              - column:
                  name: created_at
                  type: timestamp
                  constraints: {nullable: false}
              - column:
                  name: expires_at
                  type: timestamp
                  constraints: {nullable: false}
              - column: {name: used_at, type: timestamp}
              - column: {name: revoked_at, type: timestamp}
        - addUniqueConstraint:
            tableName: password_reset_tokens
            columnNames: token_hash
            constraintName: uq_password_reset_tokens_token_hash
        - createIndex:
            tableName: password_reset_tokens
            indexName: ix_password_reset_tokens_user_id
            columns:
              - column: {name: user_id}
        - addForeignKeyConstraint:
            baseTableName: password_reset_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_password_reset_tokens_user
            onDelete: CASCADE
        - dropColumn:
            tableName: users
            columnName: reset_password_token
