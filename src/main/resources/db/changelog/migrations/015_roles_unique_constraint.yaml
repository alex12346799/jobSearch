databaseChangeLog:
  - changeSet:
      id: 015_roles_unique_constraint
      author: codex
      comment: Deduplicate valid roles and enforce unique role names
      preConditions:
        - onFail: HALT
        - onFailMessage: "Unexpected role name found; expected only APPLICANT, EMPLOYER, or ADMIN"
        - onError: HALT
        - onErrorMessage: "Unable to validate role names before adding the unique constraint"
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT COUNT(*)
              FROM roles
              WHERE role_name IS NULL
                 OR role_name NOT IN ('APPLICANT', 'EMPLOYER', 'ADMIN')
      changes:
        - sql:
            sql: |
              UPDATE users
              SET role_id = (SELECT MIN(id) FROM roles WHERE role_name = 'APPLICANT')
              WHERE role_id IN (SELECT id FROM roles WHERE role_name = 'APPLICANT');

              UPDATE users
              SET role_id = (SELECT MIN(id) FROM roles WHERE role_name = 'EMPLOYER')
              WHERE role_id IN (SELECT id FROM roles WHERE role_name = 'EMPLOYER');

              UPDATE users
              SET role_id = (SELECT MIN(id) FROM roles WHERE role_name = 'ADMIN')
              WHERE role_id IN (SELECT id FROM roles WHERE role_name = 'ADMIN');

              DELETE FROM roles
              WHERE id NOT IN (
                SELECT canonical_role.id
                FROM (
                  SELECT MIN(id) AS id
                  FROM roles
                  GROUP BY role_name
                ) canonical_role
              );
        - addUniqueConstraint:
            tableName: roles
            columnNames: role_name
            constraintName: uq_roles_role_name
