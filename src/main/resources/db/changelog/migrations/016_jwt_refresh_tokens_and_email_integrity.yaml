databaseChangeLog:
  - changeSet:
      id: 016_normalize_users_email
      author: codex
      comment: Normalize email and reject ambiguous case-insensitive duplicates
      preConditions:
        - onFail: HALT
        - onFailMessage: "Cannot normalize users.email: blank values or case-insensitive duplicates exist"
        - onError: HALT
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT
                (SELECT COUNT(*) FROM users WHERE email IS NULL OR TRIM(email) = '')
                +
                (SELECT COUNT(*) FROM (
                  SELECT LOWER(TRIM(email)) AS normalized_email
                  FROM users
                  GROUP BY LOWER(TRIM(email))
                  HAVING COUNT(*) > 1
                ) duplicate_emails)
      changes:
        - sql:
            sql: UPDATE users SET email = LOWER(TRIM(email));
        - addUniqueConstraint:
            tableName: users
            columnNames: email
            constraintName: uq_users_email_normalized
        - sql:
            sql: |
              ALTER TABLE users
              ADD CONSTRAINT ck_users_email_normalized
              CHECK (email = LOWER(TRIM(email)) AND TRIM(email) <> '');

  - changeSet:
      id: 016_create_refresh_tokens
      author: codex
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: timestamp
              - column:
                  name: revoked_at
                  type: timestamp
              - column:
                  name: replaced_by_token_id
                  type: bigint
        - addUniqueConstraint:
            tableName: refresh_tokens
            columnNames: token_hash
            constraintName: uq_refresh_tokens_token_hash
        - addForeignKeyConstraint:
            baseTableName: refresh_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_refresh_tokens_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: refresh_tokens
            baseColumnNames: replaced_by_token_id
            referencedTableName: refresh_tokens
            referencedColumnNames: id
            constraintName: fk_refresh_tokens_replacement
            onDelete: SET NULL
        - createIndex:
            tableName: refresh_tokens
            indexName: ix_refresh_tokens_user_id
            columns:
              - column:
                  name: user_id
