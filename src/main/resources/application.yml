spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: jobSearch
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobsearch}
    username: ${DB_USERNAME:jobsearch}
    password: ${DB_PASSWORD:jobsearch_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:/db/changelog/master.yaml
  mvc:
#    static-path-pattern: /static/**
    log-request-details: false
  servlet:
    multipart:
      max-file-size: ${AVATAR_MAX_SIZE:5242880}B
      max-request-size: ${AVATAR_MAX_SIZE:5242880}B
  freemarker:
    expose-session-attributes: false

#================= Mail config
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:jobsearch@localhost}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls.enable: ${MAIL_STARTTLS:false}
#================= Mail config
  web:
    resources:
      static-locations: classpath:/static/

storage:
  minio:
    enabled: ${MINIO_ENABLED:true}
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:}
    avatar-max-size: ${AVATAR_MAX_SIZE:5242880}

auth:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:8089/password-reset}
    token-ttl: ${PASSWORD_RESET_TOKEN_TTL:PT30M}



server:
  port:
   8089
logging:
  level:
    root: info
    org:
      hibernate:
        error
      springframework:
        security: error
    sql: error
  pattern:
    file: '%d{yyyy-mm-dd hh:mm:ss} %-5level %logger{36} -msg%n'
  file:
    path: logs
