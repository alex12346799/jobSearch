spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: jobSearch
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobsearch}
    username: ${DB_USERNAME:jobsearch}
    password: ${DB_PASSWORD:jobsearch_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:/db/changelog/master.yaml
  mvc:
#    static-path-pattern: /static/**
    log-request-details: false
  freemarker:
    expose-session-attributes: false

#================= Mail config
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:jobsearch@localhost}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls.enable: ${MAIL_STARTTLS:false}
#================= Mail config
  web:
    resources:
      static-locations: classpath:/static/, file:./data/images/

auth:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:8089/password-reset}
    token-ttl: ${PASSWORD_RESET_TOKEN_TTL:PT30M}



server:
  port:
   8089
logging:
  level:
    root: info
    org:
      hibernate:
        error
      springframework:
        security: error
    sql: error
  pattern:
    file: '%d{yyyy-mm-dd hh:mm:ss} %-5level %logger{36} -msg%n'
  file:
    path: logs
